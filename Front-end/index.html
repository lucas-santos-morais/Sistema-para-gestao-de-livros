<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca - Lista de Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="titulo-unifacef">UNIFECAF</h1>
        <h2>Lista de Livros</h2>
    </header>

    <!-- Formulário para cadastrar/atualizar livros -->
    <form id="formCadastro">
        <h3 id="formTitulo">Cadastrar Novo Livro</h3>
        <input type="hidden" name="id" id="idLivro">
        <input type="text" name="titulo" id="titulo" placeholder="Título" required>
        <input type="text" name="autor" id="autor" placeholder="Autor" required>
        <input type="number" name="ano_publicacao" id="ano_publicacao" placeholder="Ano" required>
        <input type="text" name="genero" id="genero" placeholder="Gênero" required>
        <input type="text" name="isbn" id="isbn" placeholder="ISBN" required>
        <input type="url" name="foto" id="foto" placeholder="URL da Capa" required>
        <button type="submit" id="btnCadastrar">Cadastrar</button>
        <button type="button" id="btnCancelar" style="display:none;">Cancelar</button>
    </form>

    <button class="btn-azul" onclick="loadBooks()">Carregar Livros</button>
    <div id="livros"></div>

    <script src="script.js"></script>
</body>
</html>
